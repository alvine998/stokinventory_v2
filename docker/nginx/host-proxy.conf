# ============================================================
#  Host-level nginx reverse proxy for stokinventory.com
#  with Let's Encrypt SSL (Certbot)
#
#  First-time setup on the server:
#    1. Copy & enable this config (HTTP only first):
#         sudo cp docker/nginx/host-proxy.conf /etc/nginx/sites-available/stokinventory.com
#         sudo ln -s /etc/nginx/sites-available/stokinventory.com /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#
#    2. Install Certbot and obtain certificate:
#         sudo apt install -y certbot python3-certbot-nginx
#         sudo certbot --nginx -d stokinventory.com -d www.stokinventory.com
#
#    Certbot will automatically upgrade this file to HTTPS and
#    set up auto-renewal via a systemd timer.
#
#  Manual renewal (if needed):
#    sudo certbot renew --dry-run
# ============================================================

# ---- HTTP (certbot will upgrade this to HTTPS automatically) ----
server {
    listen 80;
    server_name stokinventory.com www.stokinventory.com;

    # Increase body size to match PHP upload limit
    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:8003;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (needed for Laravel Echo / Reverb)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 60;
    }
}
