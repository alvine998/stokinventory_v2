# ============================================================
#  Host-level nginx reverse proxy for stokinventory.com
#  with Let's Encrypt SSL (Certbot)
#
#  First-time setup on the server:
#    1. Copy & enable this config (HTTP only first):
#         sudo cp docker/nginx/host-proxy.conf /etc/nginx/sites-available/stokinventory.com
#         sudo ln -s /etc/nginx/sites-available/stokinventory.com /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#
#    2. Install Certbot and obtain certificate:
#         sudo apt install -y certbot python3-certbot-nginx
#         sudo certbot --nginx -d stokinventory.com -d www.stokinventory.com
#
#    Certbot will automatically fill in the ssl_certificate paths below
#    and set up auto-renewal via a systemd timer.
#
#  Manual renewal (if needed):
#    sudo certbot renew --dry-run
# ============================================================

# ---- HTTP: redirect all traffic to HTTPS -------------------
server {
    listen 80;
    server_name stokinventory.com www.stokinventory.com;

    # Allow Let's Encrypt ACME challenge through
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: reverse proxy to Docker container --------------
server {
    listen 443 ssl;
    server_name stokinventory.com www.stokinventory.com;

    # Certbot will populate these paths automatically
    ssl_certificate     /etc/letsencrypt/live/stokinventory.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stokinventory.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    # Increase body size to match PHP upload limit
    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (needed for Laravel Echo / Reverb)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 60;
    }
}
