# ============================================================
#  Host-level nginx reverse proxy for stokinventory.com
#
#  Deploy on the server:
#    sudo cp docker/nginx/host-proxy.conf /etc/nginx/sites-available/stokinventory.com
#    sudo ln -s /etc/nginx/sites-available/stokinventory.com /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name stokinventory.com www.stokinventory.com;

    # Increase body size to match PHP upload limit
    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (needed for Laravel Echo / Reverb)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 60;
    }
}
