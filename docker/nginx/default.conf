# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name stokinventory.com www.stokinventory.com;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name stokinventory.com www.stokinventory.com;

    ssl_certificate     /etc/letsencrypt/live/stokinventory.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stokinventory.com/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (optional but recommended — 6 months)
    add_header Strict-Transport-Security "max-age=15768000" always;

    root /var/www/public;
    index index.php;

    # Allow large file uploads (match PHP upload_max_filesize)
    client_max_body_size 50M;

    # Laravel front-controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP files to PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 60;
    }

    # Deny access to hidden files (e.g. .htaccess, .env)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Static assets — serve directly with long cache headers
    location ~* \.(css|js|gif|ico|jpg|jpeg|png|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_log  /var/log/nginx/stokinventory_error.log;
    access_log /var/log/nginx/stokinventory_access.log;
}
