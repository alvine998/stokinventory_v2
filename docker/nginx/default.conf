server {
    listen 80;
    server_name stokinventory.com www.stokinventory.com _;

    root /var/www/public;
    index index.php;

    # Allow large file uploads (match PHP upload_max_filesize)
    client_max_body_size 50M;

    # Laravel front-controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP files to PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 60;
    }

    # Deny access to hidden files (e.g. .htaccess, .env)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Static assets — serve directly with long cache headers
    location ~* \.(css|js|gif|ico|jpg|jpeg|png|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_log  /var/log/nginx/stokinventory_error.log;
    access_log /var/log/nginx/stokinventory_access.log;
}
