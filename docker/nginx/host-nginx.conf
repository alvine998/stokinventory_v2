# Place this file at: /etc/nginx/sites-available/stokinventory.com
# Then: sudo ln -s /etc/nginx/sites-available/stokinventory.com /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name stokinventory.com www.stokinventory.com;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy → Docker nginx on port 8003
server {
    listen 443 ssl;
    http2 on;
    server_name stokinventory.com www.stokinventory.com;

    ssl_certificate     /etc/letsencrypt/live/stokinventory.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stokinventory.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15768000" always;

    # Allow large file uploads
    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }
}
